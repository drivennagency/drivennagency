backend:
  name: github
  repo: drivennagency/drivennagency
  branch: main
  base_url: https://www.drivennagency.nl
  auth_endpoint: api/auth

site_url: https://www.drivennagency.nl
display_url: https://www.drivennagency.nl
logo_url: https://www.drivennagency.nl/assets/logo/logo-transparant-zwart.png

# Geüploade afbeeldingen komen in deze map en worden zo naar de site gelinkt.
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Meertaligheid: NL is de basis, EN en DE zijn vertalingen.
i18n:
  structure: single_file
  locales: [nl, en, de]
  default_locale: nl

collections:
  # ------------------------------------------------------------------ BLOG
  - name: blog
    label: "Blog"
    label_singular: "Blogartikel"
    description: "Blogartikelen maken, aanpassen of verwijderen (in NL, EN en DE)."
    folder: "content/blog"
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    identifier_field: slug
    summary: "{{fields.slug}}  ·  {{date}}"
    i18n: true
    fields:
      - { name: slug, label: "Slug (in de URL)", widget: string, i18n: duplicate, hint: "Alleen kleine letters en streepjes, bijv. website-voor-horeca" }
      - { name: date, label: "Datum", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", i18n: duplicate }
      - { name: category, label: "Categorie", widget: string, i18n: duplicate, hint: "Bijv. SEO, Branche, Tips" }
      - { name: image, label: "Afbeelding", widget: image, required: false, i18n: duplicate }
      - { name: reading_time_min, label: "Leestijd (minuten)", widget: number, required: false, default: 4, value_type: int, i18n: duplicate }
      - { name: titel, label: "Titel", widget: string, i18n: true }
      - { name: samenvatting, label: "Samenvatting", widget: text, i18n: true }
      - { name: tekst, label: "Tekst", widget: markdown, i18n: true }

  # ---------------------------------------------------------- AI-OPLOSSINGEN
  - name: ai
    label: "AI-oplossingen"
    label_singular: "AI-oplossing"
    description: "Producten toevoegen, aanpassen of verwijderen. Vul per product de prijs en de Stripe-betaallink in."
    folder: "content/ai"
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    identifier_field: slug
    summary: "{{fields.slug}}  ·  {{fields.prijs}}"
    i18n: true
    fields:
      - { name: slug, label: "Slug (in de URL)", widget: string, i18n: duplicate, hint: "Alleen kleine letters en streepjes, bijv. offertes-planningen-facturen" }
      - name: categorie
        label: "Categorie"
        widget: select
        i18n: duplicate
        options:
          - { label: "Documenten & administratie", value: documenten }
          - { label: "Tekst & data", value: tekst }
          - { label: "Klantcommunicatie", value: communicatie }
      - { name: prijs, label: "Prijs", widget: string, required: false, i18n: duplicate, hint: "Bijv. € 299 — leeg laten bij 'binnenkort'" }
      - { name: stripe_link, label: "Stripe-betaallink", widget: string, required: false, i18n: duplicate, hint: "Plak je Stripe Payment Link, bijv. https://buy.stripe.com/xxxxx" }
      - { name: banner, label: "Bannerafbeelding", widget: image, required: false, i18n: duplicate }
      - name: apps
        label: "Werkt met (apps)"
        widget: list
        required: false
        i18n: duplicate
        field: { name: app, label: "App", widget: string }
      - { name: binnenkort, label: "Binnenkort beschikbaar (nog niet te koop)", widget: boolean, default: false, i18n: duplicate }
      - { name: titel, label: "Titel", widget: string, i18n: true }
      - { name: samenvatting, label: "Samenvatting", widget: text, i18n: true }
      - { name: prijs_note, label: "Prijs-notitie", widget: string, required: false, i18n: true, hint: "Bijv. eenmalig" }
      - { name: beschrijving, label: "Beschrijving", widget: markdown, i18n: true }
      - name: voordelen
        label: "Voordelen"
        widget: list
        required: false
        i18n: true
        field: { name: voordeel, label: "Voordeel", widget: string }
      - { name: vereiste, label: "Vereiste ('Is dit iets voor jou?')", widget: string, required: false, i18n: true }
      - name: faq
        label: "Veelgestelde vragen"
        widget: list
        required: false
        i18n: true
        fields:
          - { name: v, label: "Vraag", widget: string }
          - { name: a, label: "Antwoord", widget: text }

  # ------------------------------------------------------------------ CASES
  - name: cases
    label: "Cases / Referenties"
    label_singular: "Case"
    description: "Projecten/cases toevoegen, aanpassen of verwijderen."
    folder: "content/cases"
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    identifier_field: slug
    summary: "{{fields.slug}}"
    i18n: true
    fields:
      - { name: slug, label: "Slug (in de URL)", widget: string, i18n: duplicate }
      - { name: image, label: "Afbeelding", widget: image, required: false, i18n: duplicate }
      - { name: link, label: "Link naar de live website", widget: string, required: false, i18n: duplicate }
      - { name: categorie, label: "Categorie", widget: string, required: false, i18n: duplicate, hint: "Bijv. Website" }
      - { name: titel, label: "Titel", widget: string, i18n: true }
      - { name: beschrijving, label: "Beschrijving", widget: text, i18n: true }
