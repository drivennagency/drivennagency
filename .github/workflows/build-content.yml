name: Build content
# Bouwt de statische pagina's opnieuw na een wijziging op main (bijv. via het CMS)
# en commit het resultaat, maar alleen als alle controles slagen.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'components/**'
      - 'scripts/**'
      - 'assets/css/**'
      - 'js/**'
      - 'assets/images/uploads/**'
      - '**.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-content
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genereer statische pagina's
        run: python3 scripts/build_content.py
      - name: Controleer de website (links, hreflang, structured data, sitemap)
        run: python3 scripts/check_site.py
      - name: Test het build-script
        run: python3 -m unittest discover -s tests
      - name: Test de API-functies
        run: node --test tests/*.test.js
      - name: Commit gegenereerde bestanden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenereer statische pagina's uit content"
            git push
          else
            echo "Geen wijzigingen om te committen."
          fi
